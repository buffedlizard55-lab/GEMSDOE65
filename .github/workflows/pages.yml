name: Publish research site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages uses workflow deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages is still configured for legacy branch publishing. Set Settings → Pages → Source to GitHub Actions, then rerun this workflow."
            exit 1
          fi
      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
