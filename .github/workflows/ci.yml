name: Verification
on:
  push:
    branches: [main, 'arena/f09c3103-gemsdoe65']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public metadata UI and offline fallback without external requests
        run: node tests/browser/feed-unit.cjs
      - name: Verify immutable template pins and build negative-result site
        run: python scripts/build_site.py
      - name: Unit, gradient, format, gate and publication tests
        run: python -m pytest -q --junitxml=.cache/verification-tests.xml
      - name: Check local links, JSON identity and absence of public rasters
        run: python scripts/check_site.py
      - name: Reject accidental large/training artifacts in Git
        run: python scripts/check_repository.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: .cache/verification-tests.xml
          if-no-files-found: ignore
