name: lane65-sarprop verification

# Verify-only workflow for the second, independently developed lineage of this
# lane, which lives entirely under lane65-sarprop/.  It is path-filtered so it
# never runs for the canonical site's changes, and it never deploys anything:
# publishing on this repository belongs to pages.yml alone.
#
# The model artifact is not tracked in Git by design, so the job rebuilds the
# identical pixel field from the committed dot list before checking that the
# published pages agree with it.  No network and no competition data needed.

on:
  push:
    branches: ["arena/a71d399c-gemsdoe65", main]
    paths:
      - "lane65-sarprop/**"
      - ".github/workflows/lane65-sarprop.yml"
  pull_request:
    branches: [main]
    paths:
      - "lane65-sarprop/**"
      - ".github/workflows/lane65-sarprop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane65-sarprop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: lane65-sarprop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lane65-sarprop/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (synthetic fixtures; no competition rasters required)
        run: python -m pytest tests/ -q
      - name: Verify the artifact's pixels against the committed dot list
        # The artifact is untracked by design, so this proves the documented
        # information content (74,351 distinct positive pixels) without writing a
        # rebuild into docs/ and without needing the public bridge rasters.
        run: python scripts/reconstruct_submission.py --direct --check
      - name: The published site must agree with the published raster
        run: python scripts/check_site.py
      - name: Rebuild the site and require it to be byte-identical
        run: |
          python scripts/run_lane.py site
          git status --porcelain -- docs/ HYPOTHESES.md
          test -z "$(git status --porcelain -- docs/ HYPOTHESES.md)"
