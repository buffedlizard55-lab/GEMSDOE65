name: Research site and metadata feed
on:
  push:
    branches: [main]
  schedule:
    - cron: '22 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh public repository metadata (never train or submit)
        run: python scripts/refresh_feed.py
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - run: python scripts/check_repository.py
      - name: Stage only the public site, not the repository or quarantine
        run: |
          mkdir -p .cache/pages
          cp index.html .nojekyll .cache/pages/
          cp -R docs .cache/pages/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy research site
        id: deployment
        uses: actions/deploy-pages@v4
