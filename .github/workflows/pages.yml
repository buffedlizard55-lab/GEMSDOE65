name: Refresh leaderboard and publish research site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/refresh_leaderboard.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v4
      - name: Refresh public leaderboard feed
        id: refresh
        shell: bash
        run: |
          if python3 scripts/refresh_leaderboard.py --output docs/data/leaderboard.json; then
            echo "state=refreshed" >> "$GITHUB_OUTPUT"
          else
            echo "state=stale" >> "$GITHUB_OUTPUT"
            echo "::warning::Leaderboard refresh failed; publishing the last validated snapshot with a stale-data warning."
          fi
      - name: Mark retained snapshot as stale
        if: steps.refresh.outputs.state == 'stale'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/data/leaderboard.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["refresh_status"] = "stale"
          data["refresh_warning"] = "The scheduled page fetch or validation failed; the prior verified snapshot was retained. Visit the official leaderboard for current values."
          temporary = path.with_name(path.name + ".tmp")
          temporary.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          temporary.replace(path)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
